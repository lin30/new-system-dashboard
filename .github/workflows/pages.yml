name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify NEW-only data contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("dashboard/current.json").read_text(encoding="utf-8"))
          import hashlib
          assert hashlib.sha256(Path("dashboard/current.json").read_bytes()).hexdigest() == "470e514a07620abcbd793132d2addf46d4135874f2875d43e5a4fbee186e8ae7"
          assert p["system_id"] == "NEW_SYSTEM"
          assert p["data_boundary"] == "isolated"
          assert p["external_evidence_sharing"] is False
          for key in ("trade_permission","execution_permission","broker_connection","paper_action_enabled"):
              assert p["permissions"][key] is False
          assert p["not_an_order"] is True
          unsigned={k:v for k,v in p.items() if k!="snapshot_sha256"}
          encoded=json.dumps(unsigned,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()
          assert hashlib.sha256(encoded).hexdigest()==p["snapshot_sha256"]
          assert p["snapshot_sha256"] == "c2dce7f5f3e5b0f49378cc5fdc1ff71b970e5df7a97a76ec81e7c5fe50e3210b"
          assert p["modules"]["candidate_weekly"]["status"] == "unavailable"
          assert p["modules"]["candidate_weekly"]["data"] == {"authority":"CANDIDATE"}
          assert p["modules"]["opportunities"]["status"] == "unavailable"
          assert p["modules"]["opportunities"]["data"] == {"authority":"NOMINATION"}
          formal = p["modules"]["formal_weekly"]["data"]
          assert formal["as_of"] == "2026-W40" and formal["case_denominator"] == 1380 and formal["card_n"] == 5
          assert {card["security_id"] for card in formal["formal_cards"]} == {"SZSE:001389","SZSE:300502","SZSE:300308","SZSE:301150","SZSE:301511"}
          assert len(formal["research_sections"]) == 12
          assert formal["report_markdown_sha256"] == "394eb43bc979730adee0c90614d4e084debd9db81e822686cf746106d259e97e"
          continuity = [row for row in p["modules"]["watchlist"]["data"]["items"] if row["authority"] == "CONTINUITY"]
          assert continuity == []
          assert formal["weekly_current_sha256"] == "aa7a9ef37aca60b79ac44cacf9a1bc6a021f3a35742e4287d34999c18bc5cf8a"
          assert formal["release_sha"] == "92f4b8a0ab7694d411f2f430a7e97a40b0671bba"
          assert [x["title"] for x in formal["research_sections"]][0] == "本周变化"
          serialized = json.dumps(p, ensure_ascii=False)
          for forbidden in ("NEW-CNY-", "account_cash", "account_nav", "account_sha256",
                            "suggested_value", "nav_percent", "/Users/", "/private/tmp/",
                            "1000000.00", "simulation_account"):
              assert forbidden not in serialized
          assert all(row["current_state"] == "等待行情" and row["next_review"] == "2026-10-13" for row in continuity)
          archive_bytes = Path("dashboard/history/2026-09-22.json").read_bytes()
          assert hashlib.sha256(archive_bytes).hexdigest() == p["history_ref"]["file_sha256"] == "0f5fd1f2acef8182361ef0148e4de645c62aae3f38892a9d9eb5e39dcbe2982f"
          archive = json.loads(archive_bytes)
          assert archive["source_cutoff"] == p["history_ref"]["source_cutoff"] == "2026-09-22T15:40:00+08:00"
          assert archive["snapshot_sha256"] == p["history_ref"]["snapshot_sha256"]
          assert archive["modules"]["candidate_weekly"]["data"]["adoption_pending"] is True
          assert all(archive["permissions"][key] is False for key in p["permissions"])
          assert set(p["modules"]) == {
              "formal_weekly",
              "candidate_weekly",
              "watchlist",
              "opportunities",
              "system_health",
          }
          assert p["navigation"] == [
              "总览",
              "周报",
              "关注标的",
              "新机会",
              "研究进展",
              "系统状态",
          ]
          PY

      - name: Verify continuity and current authority rendering
        run: node tests/continuity.cjs

      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/dashboard/history
          cp index.html app.js styles.css .nojekyll _site/
          cp dashboard/current.json _site/dashboard/current.json
          cp dashboard/history/2026-09-22.json _site/dashboard/history/2026-09-22.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
