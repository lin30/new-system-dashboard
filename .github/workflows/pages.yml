name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify NEW-only data contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path("dashboard/current.json").read_text(encoding="utf-8"))
          assert p["system_id"] == "NEW_SYSTEM"
          assert p["data_boundary"] == "isolated"
          assert p["external_evidence_sharing"] is False
          for key in ("trade_permission","execution_permission","broker_connection","paper_action_enabled"):
              assert p["permissions"][key] is False
          assert p["not_an_order"] is True
          import hashlib
          unsigned={k:v for k,v in p.items() if k!="snapshot_sha256"}
          encoded=json.dumps(unsigned,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()
          assert hashlib.sha256(encoded).hexdigest()==p["snapshot_sha256"]
          assert set(p["modules"]) == {
              "formal_weekly",
              "candidate_weekly",
              "watchlist",
              "opportunities",
              "system_health",
          }
          assert p["navigation"] == [
              "总览",
              "周报",
              "关注标的",
              "新机会",
              "研究进展",
              "系统状态",
          ]
          PY

      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/dashboard
          cp index.html app.js styles.css .nojekyll _site/
          cp dashboard/current.json _site/dashboard/current.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
